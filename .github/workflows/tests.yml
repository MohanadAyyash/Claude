# Runs the test suite on every pull request (the "tests" check required before merging into the main branch).
name: tests
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          SKIP_PDF: '1'          # no headless-browser PDF rendering in CI
          TZ: Asia/Dubai
      - name: Set up Chrome for PDF integration test
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        id: setup-chrome
        with:
          chrome-version: stable
      - name: Test PDF rendering with the runner's headless browser
        run: node --no-warnings test-reportpdf.js
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
      - run: npm run build:standalone
